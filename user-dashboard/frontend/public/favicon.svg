<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Indigo to Vibrant Violet -->
    <linearGradient id="userBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Star Primary Gradient: Brilliant White to Radiant Gold -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FABE56" />
    </linearGradient>

    <!-- Companion Star Gradient -->
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#userBgGrad)" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Inner Subtle Specular Border Highlight -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.18" />

  <!-- Primary UWO Referral 4-Point Luminous Starburst -->
  <path d="M29 11 C29 23 20 29 9 29 C20 29 29 35 29 47 C29 35 38 29 49 29 C38 29 29 23 29 11 Z" fill="url(#starGrad)" filter="url(#softShadow)" />

  <!-- Secondary Companion Sparkle (Top-Right) -->
  <path d="M47 13 C47 18 43 21 38 21 C43 21 47 24 47 29 C47 24 51 21 56 21 C51 21 47 18 47 13 Z" fill="url(#compGrad)" filter="url(#softShadow)" />

  <!-- Micro Center Gleam -->
  <circle cx="29" cy="29" r="2" fill="#FFFFFF" opacity="0.9" />
</svg>
